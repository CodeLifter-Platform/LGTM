# Shared logic behind the RELEASE MINOR / RELEASE MAJOR buttons.
#
# Takes the newest pre-release, works out the new version from the git tags, and REBUILDS
# that pre-release's commit with the release version compiled in. The source is identical
# to what was tested; only the version string differs — so `App 0.6.0` actually reports
# 0.6.0, and its filenames read 0.6.0.
#
# The trade-off, stated plainly: the released binaries are not the same bytes that were
# tested as a pre-release, they are a fresh build of the same commit. Tests re-run as part
# of the rebuild. Anything that makes a build non-reproducible from its commit (an
# unpinned dependency, a floating base image) becomes a real risk here — pin it.

name: Promote

on:
  workflow_call:
    inputs:
      bump:
        description: minor | major
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ── Work out what to build, and from which commit ───────────────
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      promoted_from: ${{ steps.v.outputs.promoted_from }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tags are the source of truth; a shallow clone has none

      - name: Resolve the pre-release to promote
        id: v
        env:
          # Repos that pin their major (Iconizit.Core tracks Font Awesome) set this.
          MAJOR_PIN: ${{ vars.MAJOR_PIN }}
        run: |
          git fetch --tags --force --quiet

          # sort -V, not a lexical sort: 0.9.9 < 0.9.14 < 0.9.56 only holds under version
          # ordering, and lexically 0.9.9 would win.
          PRE="$(git tag --list 'v*-pre' \
            | sed -E 's/^v//; s/-pre$//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1 || true)"
          if [ -z "$PRE" ]; then
            echo "::error::no pre-release tag to promote. Merge a PR into main first — the" \
                 "release buttons promote a tested build, they do not create one."
            exit 1
          fi

          PRE_TAG="v${PRE}-pre"
          NEXT="$(./.github/scripts/next-version.sh "${{ inputs.bump }}")"

          {
            echo "version=${NEXT}"
            echo "promoted_from=${PRE_TAG}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Promoting \`${PRE_TAG}\` → \`v${NEXT}\`"
            echo ""
            echo "Rebuilding commit \`$(git rev-parse --short "$PRE_TAG"^{commit})\` with"
            echo "\`${NEXT}\` compiled in."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Rebuild that commit, at the release version, and publish ────
  build:
    needs: resolve
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.resolve.outputs.promoted_from }}
      version: ${{ needs.resolve.outputs.version }}
      is_prerelease: false
      promoted_from: ${{ needs.resolve.outputs.promoted_from }}
    secrets: inherit
